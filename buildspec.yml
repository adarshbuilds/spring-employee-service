
version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto25

  build:
    commands:
      - echo Building and packaging the application...
      - mvn clean package -DskipTests

  post_build:
    commands:
      - echo Build and packaging completed.
      - ls -lh target/*.jar

artifacts:
  files:
    - target/*.jar
  discard-paths: yes

cache:
  paths:
    - '/root/.m2/**/*'
